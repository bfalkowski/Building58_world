<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene viewer</title>
<style>
  :root { --bg: #050608; --ink: #c9c3b4; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 Georgia, serif; overflow: hidden; }
  #help { position: fixed; left: 16px; bottom: 16px; opacity: .75; }
  #light { position: fixed; right: 16px; bottom: 16px; width: 230px; padding: 10px 12px; background: rgba(8, 9, 12, .82);
    border: 1px solid #3a3326; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; }
  #light b { grid-column: 1 / -1; font-weight: normal; letter-spacing: .04em; }
  #light input { width: 100%; }
  #light button { grid-column: 1 / -1; background: #2a241a; color: var(--ink); border: 1px solid #5a4c33; font: inherit; cursor: pointer; }
  @media (max-width: 600px) { #help { display: none; } #light { left: 16px; width: auto; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="help">Drag to turn. Scroll to move in. Right-drag to slide. Scene: <span id="name"></span></div>
<div id="light">
  <b>Light</b>
  <label for="room">Room</label><input id="room" type="range" min="0" max="4" step="0.05">
  <label for="bright">Brightness</label><input id="bright" type="range" min="0.3" max="3" step="0.05">
  <label for="lamps">Lamps</label><input id="lamps" type="range" min="-4" max="-1.5" step="0.05">
  <label for="haze">Haze</label><input id="haze" type="range" min="0" max="0.08" step="0.002">
  <label for="glow">Glow</label><input id="glow" type="range" min="0" max="1.5" step="0.05">
  <button id="reset">Reset</button>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// Which scene: viewer.html?scene=desk loads out/desk.glb. An add-on, such as
// &addon=find-the-ring/replay.js, is a module from this repo that gets the loaded scene and a hook
// that runs every frame. Only a path inside the repo is accepted.
const params = new URLSearchParams(location.search);
const name = params.get('scene') || 'desk';
const addon = params.get('addon');
const frames = [];
document.getElementById('name').textContent = name;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.AgXToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050608);
scene.fog = new THREE.FogExp2(0x0a0d12, 0.02);
// Room: an even light from above and below, with no bright spots, so the room can be lit up
// without the lamps glaring. Brightness: the exposure of the whole picture.
const room = new THREE.HemisphereLight(0xd8cbb0, 0x302820, 1.2);
scene.add(room);
// Blender's light strengths come out far stronger than three.js expects, so every lamp is scaled
// by one factor, 10 to the slider's power.
const lamps = [];

let camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
camera.position.set(-1.5, 1.6, 2.3);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 0.9, -1);
controls.enableDamping = true;

const composer = new EffectComposer(renderer);
const pass = new RenderPass(scene, camera);
composer.addPass(pass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.5, 0.85);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// The light controls. Each viewer's settings are kept in this browser only.
const DEFAULTS = { room: 1.2, bright: 1, lamps: -2.8, haze: 0.02, glow: 0.35 };
const apply = {
  room: (v) => { room.intensity = v; },
  bright: (v) => { renderer.toneMappingExposure = v; },
  lamps: (v) => { for (const l of lamps) l.intensity = l.userData.base * 10 ** v; },
  haze: (v) => { scene.fog.density = v; },
  glow: (v) => { bloom.strength = v; },
};
let saved = {};
try { saved = JSON.parse(localStorage.getItem('viewer-light') || '{}'); } catch {}
const set = (k, v) => { document.getElementById(k).value = v; apply[k](Number(v)); };
const setLamps = () => apply.lamps(Number(document.getElementById('lamps').value));
for (const k of Object.keys(DEFAULTS)) {
  set(k, saved[k] ?? DEFAULTS[k]);
  document.getElementById(k).oninput = (e) => {
    apply[k](Number(e.target.value));
    saved[k] = Number(e.target.value);
    try { localStorage.setItem('viewer-light', JSON.stringify(saved)); } catch {}
  };
}
document.getElementById('reset').onclick = () => {
  saved = {};
  try { localStorage.removeItem('viewer-light'); } catch {}
  for (const [k, v] of Object.entries(DEFAULTS)) set(k, v);
};

new GLTFLoader().load(`../out/${name}.glb?v=${Date.now()}`, async (gltf) => {
  gltf.scene.traverse((o) => {
    if (o.isMesh) { o.castShadow = o.receiveShadow = true; }
    // A lamp casts a shadow only when its scene says so. Each shadow takes one of a GPU's few
    // texture slots, and too many turn the whole picture black.
    if (o.isLight) {
      o.userData.base = o.intensity; lamps.push(o);
      o.castShadow = (o.userData.shadow ?? o.parent?.userData.shadow) !== false;
      if (o.castShadow) { o.shadow.bias = -0.0005; o.shadow.mapSize.set(1024, 1024); }
    }
  });
  scene.add(gltf.scene);
  setLamps();
  // Start where the scene's own camera stands, looking where it looks.
  const cam = gltf.cameras[0];
  if (cam) {
    cam.updateWorldMatrix(true, false);
    camera.position.setFromMatrixPosition(cam.matrixWorld);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.getWorldQuaternion(new THREE.Quaternion()));
    controls.target.copy(camera.position).addScaledVector(dir, 3);
    camera.fov = cam.fov;
    camera.updateProjectionMatrix();
  }
  if (addon && /^[\w-]+(\/[\w-]+)*\.js$/.test(addon)) {
    // A fresh copy every time, so an edited add-on shows without a hard reload.
    const mod = await import(`../${addon}?v=${Date.now()}`);
    await mod.default({ THREE, scene, root: gltf.scene, camera, renderer, controls, params, onFrame: (f) => frames.push(f) });
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const dt = clock.getDelta(); controls.update(); for (const f of frames) f(dt); composer.render(); });
</script>
</body>
</html>
